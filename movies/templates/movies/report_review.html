{% extends 'base.html' %}
{% block content %}
<div class="p-3">
  <div class="container">
    <div class="row mt-3">
      <div class="col mx-auto mb-3">
        <h2>Report A Review</h2>
        <hr />
        <form method="POST">
          {% csrf_token %}
          <p>
            <textarea name="reason" required class="form-control" id="review">Why are you reporting this comment?</textarea>
          </p>
          <div class="text-start">
            <button type="submit" class="btn bg-danger text-white">Report</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock content %}
